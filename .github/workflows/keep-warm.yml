name: Keep demo API awake

# Render's free tier sleeps after 15 minutes without traffic, and waking takes about a minute.
# Pinging /health every 10 minutes keeps the demo responsive for visitors.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          API_URL: ${{ vars.API_URL || 'https://parkspace-api.onrender.com' }}
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 90 "$API_URL/health"; then
              echo; echo "awake"; exit 0
            fi
            echo "attempt $attempt failed, retrying"; sleep 20
          done
          echo "API did not respond"; exit 1
